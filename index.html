<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIVE! 마을을 달리는 캔버스</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFFDF3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
    position: relative;
  }

  .decor {
    position: absolute;
    border-radius: 50%;
    animation: float-bob 6s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes float-bob {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-14px); }
  }
  .decor-red    { width: 76px; height: 76px; background: #FFDE6E; top: 6%;  left: 10%; animation-delay: 0s; }
  .decor-green  { width: 26px; height: 26px; background: #6EE7A8; top: 2%;  left: 48%; animation-delay: 0.6s; }
  .decor-yellow { width: 40px; height: 40px; background: #FF7A7A; top: 10%; right: 8%; animation-delay: 1.1s; }
  .decor-blue   { width: 46px; height: 46px; background: #6FA8FF; bottom: 18%; left: 12%; animation-delay: 0.4s; }
  .decor-purple { width: 24px; height: 24px; background: #D7A9F5; bottom: 22%; right: 14%; animation-delay: 1.4s; }

  main {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 64px 24px;
    width: 100%;
    max-width: 560px;
  }

  h1 {
    position: relative;
    z-index: 2;
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    font-weight: 800;
    line-height: 1.25;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }
  h1 .brand { color: #7C3AED; }
  h1 .headline {
    background: linear-gradient(90deg, #FF7A6B, #FFB35C, #FF8FC0);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    color: #8A8A8A;
    font-size: 1rem;
    margin: 0 0 44px;
  }

  nav {
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
  }

  .btn {
    display: block;
    width: 100%;
    max-width: 340px;
    padding: 16px 24px;
    border: none;
    border-radius: 999px;
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 24px rgba(0,0,0,0.14); }
  .btn:active { transform: translateY(0) scale(0.97); }

  .btn-intro    { background: linear-gradient(90deg, #FF7A8A, #FF9F55); }
  .btn-gyeonggi { background: linear-gradient(90deg, #FF9F55, #FFCF4A); }
  .btn-jeju     { background: linear-gradient(90deg, #9BE29B, #5FC97D); }
  .btn-daejeon  { background: linear-gradient(90deg, #9AC5FF, #5A9CFF); }
  .btn-guestbook{ background: linear-gradient(90deg, #5A9CFF, #2E4FE0); }
  .btn-mobility { background: linear-gradient(90deg, #FF7ACB, #B36BF0); }

  @media (prefers-reduced-motion: reduce) {
    .decor { animation: none; }
  }

  /* Password modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 24px;
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .modal-box h2 {
    margin: 0 0 6px;
    font-size: 1.2rem;
    font-weight: 800;
    color: #2f2f2f;
  }
  .modal-box p.hint {
    margin: 0 0 20px;
    font-size: 0.85rem;
    color: #9a9a9a;
  }
  .pw-inputs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 10px;
  }
  .pw-inputs input {
    width: 44px;
    height: 52px;
    text-align: center;
    font-size: 1.3rem;
    font-weight: 700;
    border: 2px solid #dcdcdc;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s ease;
    -webkit-text-security: disc;
  }
  .pw-inputs input:focus {
    border-color: #5FC97D;
  }
  .pw-inputs.shake {
    animation: shake 0.4s ease;
  }
  .pw-inputs.shake input {
    border-color: #FF6B6B;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .modal-error {
    min-height: 18px;
    font-size: 0.8rem;
    color: #FF6B6B;
    margin-bottom: 14px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-actions button {
    flex: 1;
    padding: 12px 0;
    border-radius: 999px;
    border: none;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
  }
  .modal-cancel {
    background: #F1F1F1;
    color: #6b6b6b;
  }
  .modal-submit {
    background: linear-gradient(90deg, #9BE29B, #5FC97D);
    color: #fff;
  }
</style>
</head>
<body>

  <div class="decor decor-red"></div>
  <div class="decor decor-green"></div>
  <div class="decor decor-yellow"></div>
  <div class="decor decor-blue"></div>
  <div class="decor decor-purple"></div>

  <main>
    <h1>
      <span class="brand">DRIVE</span><br>
      <span class="headline">마을을 달리는 캔버스</span>
    </h1>
    <p class="subtitle">2026 에듀테크예술교육연구회 아카이브</p>

    <nav aria-label="메뉴">
      <a class="btn btn-intro" href="https://canva.link/rslze2bjqxgsl8c" target="_blank" rel="noopener noreferrer">프로젝트 소개</a>
      <a class="btn btn-gyeonggi" href="https://padlet.com/dunjeoncho/padlet-y3ul8c02fla1ynz5" target="_blank" rel="noopener noreferrer">(경기) 포트폴리오</a>
      <a class="btn btn-jeju" href="https://padlet.com/dunjeoncho/padlet-dsv6xm9p8riopo7p" target="_blank" rel="noopener noreferrer">(제주) 포트폴리오</a>
      <a class="btn btn-daejeon" href="https://haerim9010-bit.github.io/DJdrive/" target="_blank" rel="noopener noreferrer">(대전) 포트폴리오</a>
      <a class="btn btn-guestbook" href="https://b.tkbell.co.kr/tkboard/woi/666036/4WhmqCK2L4.do?pageSeq=2464601" target="_blank" rel="noopener noreferrer">온라인 방명록</a>
      <a class="btn btn-mobility" href="https://rainbow-biscochitos-f685cd.netlify.app" target="_blank" rel="noopener noreferrer">나만의 모빌리티</a>
    </nav>
  </main>

</body>
</html>
